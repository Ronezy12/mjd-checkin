<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — CTeen Check-in</title>

  <link rel="stylesheet" href="./css/style.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0b1220">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>

<div class="wrap-admin">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="brand">
      <div class="title">CTeen — Admin</div>
      <div class="sub">Gestion • QR • Présences</div>
    </div>

    <div class="actions">
      <span class="pill" id="pill">
        <span class="dot" id="dot"></span>
        <span id="pillText">Non connecté</span>
      </span>

      <a class="btn ghost" href="./scan.html" id="goScan" style="display:none;">
        📷 Scanner
      </a>

      <button class="btn orange" id="btnLogout" style="display:none;">
        Déconnexion
      </button>
    </div>
  </div>

  <!-- GRID DASHBOARD -->
  <div class="adminGrid">

    <!-- COLONNE GAUCHE -->
    <div class="adminLeft">

      <!-- LOGIN -->
      <section class="card" id="loginBox">
        <h2>Connexion admin</h2>
        <p class="muted">Connecte-toi pour gérer les étudiants.</p>

        <input class="field" id="email" type="email" placeholder="Email">
        <input class="field" id="password" type="password" placeholder="Mot de passe">

        <label class="toggle mt10">
          <input id="showPass" type="checkbox">
          Afficher le mot de passe
        </label>

        <button class="btn orange w100 mt10" id="btnLogin">
          Se connecter
        </button>

        <p class="msg" id="loginMsg"></p>
      </section>

      <!-- CREATE STUDENT -->
      <section class="card mt10" id="adminBox" style="display:none;">
        <h2>Créer un étudiant</h2>
        <p class="muted">Ajoute un étudiant manuellement.</p>

        <div class="row mt10">
          <input class="field" id="firstName" placeholder="Prénom">
          <input class="field" id="lastName" placeholder="Nom">
        </div>

        <button class="btn w100 mt10" id="btnCreate">
          Créer
        </button>

        <p class="msg muted" id="adminStatus"></p>
      </section>

    </div>

    <!-- COLONNE DROITE -->
    <div class="adminList">

      <section class="card" id="listBox" style="display:none;">
        <div class="rowBetween">
          <div>
            <h2 class="h1">Étudiants</h2>
            <p class="muted tiny">Tableau desktop • Cartes mobile</p>
          </div>

          <button class="btn ghost" id="btnRefresh">
            ↻ Rafraîchir
          </button>
        </div>

        <!-- TABLE DESKTOP -->
        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>Nom</th>
                <th>Présences</th>
                <th>Récompenses</th>
                <th>Carte (QR)</th>
              </tr>
            </thead>
            <tbody id="students"></tbody>
          </table>
        </div>

        <!-- MOBILE CARDS -->
        <div class="cards" id="cards"></div>

      </section>

    </div>

  </div>
</div>

<!-- BOTTOM BAR MOBILE -->
<div class="bottomBar" id="bottomBar" style="display:none;">
  <div class="inner">
    <a class="btn ghost" href="./scan.html">📷 Scanner</a>
    <button class="btn orange" id="btnLogout2">Déconnexion</button>
  </div>
</div>

<!-- ⚠️ GARDE TON SCRIPT FIREBASE ICI EXACTEMENT COMME TU L’AS -->
<script type="module">
  /* COLLE ICI TON SCRIPT FIREBASE EXACT */
</script>

</body>
</html>
