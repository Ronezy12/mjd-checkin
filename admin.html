<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — CTeen Check-in</title>

  <link rel="stylesheet" href="./css/style.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0b1220">
</head>

<body>

<div class="wrap">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="brand">
      <div class="title">CTeen — Admin</div>
      <div class="sub">Gestion • QR • Présences</div>
    </div>

    <div class="actions">
      <span class="pill">
        <span class="dot" id="dot"></span>
        <span id="pillText">Non connecté</span>
      </span>

      <a class="btn ghost" href="./scan.html" id="goScan" style="display:none;">📷 Scanner</a>
      <button class="btn orange" id="btnLogout" style="display:none;">Déconnexion</button>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="grid mt10">

    <!-- LOGIN -->
    <section class="card" id="loginBox">
      <h2>Connexion admin</h2>
      <p class="muted">Connecte-toi pour gérer les étudiants.</p>

      <input class="field" id="email" type="email" placeholder="Email">
      <input class="field" id="password" type="password" placeholder="Mot de passe">

      <label class="toggle">
        <input id="showPass" type="checkbox">
        Afficher le mot de passe
      </label>

      <button class="btn orange w100 mt10" id="btnLogin">
        Se connecter
      </button>

      <p class="msg" id="loginMsg"></p>
    </section>

    <!-- ADMIN DASHBOARD -->
    <section class="card" id="listBox" style="display:none;">

      <div class="rowBetween">
        <div>
          <h2>Étudiants</h2>
          <p class="muted tiny">Tableau desktop • Cartes mobile</p>
        </div>

        <div style="display:flex; gap:10px;">
          <button class="btn ghost" id="btnRefresh">↻ Rafraîchir</button>
          <button class="btn orange" id="btnInvite">🔗 Inviter</button>
        </div>
      </div>

      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>Nom</th>
              <th>Présences</th>
              <th>Récompenses</th>
              <th>Carte</th>
            </tr>
          </thead>
          <tbody id="students"></tbody>
        </table>
      </div>

      <div class="cards" id="cards"></div>
    </section>

  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* =========================
   FIREBASE INIT
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyAbnHtXih9wlT361KeoSTRccC0vWd_9fs4",
  authDomain: "maison-des-jeunes-cteen-yerres.firebaseapp.com",
  projectId: "maison-des-jeunes-cteen-yerres",
  storageBucket: "maison-des-jeunes-cteen-yerres.firebasestorage.app",
  messagingSenderId: "473890667192",
  appId: "1:473890667192:web:973af383f7319d2cdc124d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* =========================
   UI REFERENCES
========================= */

const loginBox = document.getElementById("loginBox");
const listBox  = document.getElementById("listBox");

const btnLogin  = document.getElementById("btnLogin");
const btnLogout = document.getElementById("btnLogout");
const goScan    = document.getElementById("goScan");

const pillText  = document.getElementById("pillText");
const dot       = document.getElementById("dot");

const loginMsg  = document.getElementById("loginMsg");

/* =========================
   LOGIN
========================= */

btnLogin.onclick = async ()=>{
  loginMsg.textContent = "";
  try{
    await signInWithEmailAndPassword(
      auth,
      document.getElementById("email").value.trim(),
      document.getElementById("password").value
    );
  }catch(e){
    loginMsg.textContent = e.message;
    loginMsg.className = "msg bad";
  }
};

btnLogout.onclick = ()=> signOut(auth);

/* =========================
   INVITE BUTTON
========================= */

document.getElementById("btnInvite").onclick = async ()=>{
  const link = location.origin + "/";
  await navigator.clipboard.writeText(link);
  alert("Lien copié ✅\n\n" + link);
};

/* =========================
   LOAD STUDENTS (FIXED)
========================= */

async function loadStudents(){

  const tbody = document.getElementById("students");
  tbody.innerHTML = "";

  try{
    const snap = await getDocs(collection(db,"students"));

    if(snap.empty){
      tbody.innerHTML = `
        <tr>
          <td colspan="4">Aucun étudiant trouvé.</td>
        </tr>
      `;
      return;
    }

    snap.forEach(docu=>{
      const d = docu.data();
      const total = d.totalCheckins || 0;
      const rewards = Math.floor(total/20);

      tbody.innerHTML += `
        <tr>
          <td>${d.lastName ?? ""} ${d.firstName ?? ""}</td>
          <td>${total}</td>
          <td>${rewards}</td>
          <td>
            <a href="./student.html?sid=${docu.id}" target="_blank">
              Carte
            </a>
          </td>
        </tr>
      `;
    });

  }catch(e){
    console.error("ERREUR LOAD:", e);
    tbody.innerHTML = `
      <tr>
        <td colspan="4">Erreur Firestore.</td>
      </tr>
    `;
  }
}

/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth, async (user)=>{

  if(!user){
    pillText.textContent = "Non connecté";
    dot.classList.remove("ok");

    loginBox.style.display = "block";
    listBox.style.display = "none";

    goScan.style.display = "none";
    btnLogout.style.display = "none";
    return;
  }

  const adminSnap = await getDoc(doc(db,"admins",user.uid));

  if(!adminSnap.exists()){
    pillText.textContent = "Non autorisé";
    dot.classList.remove("ok");
    return;
  }

  // ✅ ADMIN OK
  pillText.textContent = "Admin: " + user.email;
  dot.classList.add("ok");

  loginBox.style.display = "none";
  listBox.style.display = "block";

  goScan.style.display = "inline-flex";
  btnLogout.style.display = "inline-flex";

  await loadStudents();
});

</script>

</body>
</html>
