<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CTeen — Connexion</title>

  <!-- CSS centralisé -->
  <link rel="stylesheet" href="./css/style.css">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0b1220">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>
  <div class="center">
    <div class="card card-sm">
      <div class="brandRow">
        <div class="badge"><span class="brandDot"></span> CTeen</div>
        <div class="muted tiny strong">Connexion</div>
      </div>

      <h1 class="h1">Accède à ton QR et ton suivi</h1>
      <p class="muted">Connecte-toi pour voir ton nom, ton QR, et tes présences.</p>

      <form id="form">
        <input
          id="email"
          class="field"
          type="email"
          placeholder="Email"
          autocomplete="email"
          inputmode="email"
          enterkeyhint="next"
          required
        />

        <input
          id="password"
          class="field"
          type="password"
          placeholder="Mot de passe"
          autocomplete="current-password"
          enterkeyhint="go"
          required
        />

        <div class="rowBetween">
          <label class="toggle">
            <input id="showPass" type="checkbox" />
            Afficher le mot de passe
          </label>
          <span class="muted tiny" id="caps" style="display:none;">⚠️ Majuscule activée</span>
        </div>

        <button id="btnLogin" class="btn orange w100" type="submit">Se connecter</button>
        <p class="msg" id="msg"></p>
      </form>

      <div class="divider"></div>

      <div class="links">
        <span class="muted tiny">Pas de compte ? <a href="./signup.html">Créer mon compte</a></span>
        <a class="muted tiny" href="./admin.html" style="opacity:.85;">Espace admin</a>
      </div>

      <p class="muted tiny mt12">
        Astuce : sur iPhone, “Partager” → “Ajouter à l’écran d’accueil”.
      </p>
    </div>
  </div>

  <!-- Service worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAbnHtXih9wlT361KeoSTRccC0vWd_9fs4",
      authDomain: "maison-des-jeunes-cteen-yerres.firebaseapp.com",
      projectId: "maison-des-jeunes-cteen-yerres",
      storageBucket: "maison-des-jeunes-cteen-yerres.firebasestorage.app",
      messagingSenderId: "473890667192",
      appId: "1:473890667192:web:973af383f7319d2cdc124d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("form");
    const emailEl = document.getElementById("email");
    const passEl = document.getElementById("password");
    const showPass = document.getElementById("showPass");
    const msg = document.getElementById("msg");
    const btnLogin = document.getElementById("btnLogin");
    const caps = document.getElementById("caps");

    function setMsg(text, kind=""){
      msg.className = "msg " + kind;
      msg.textContent = text;
    }

    onAuthStateChanged(auth, (u)=>{
      if(u) location.href="./me.html";
    });

    emailEl.focus();

    showPass.addEventListener("change", (e)=>{
      passEl.type = e.target.checked ? "text" : "password";
    });

    passEl.addEventListener("keyup", (e)=>{
      if(e.getModifierState && e.getModifierState("CapsLock")){
        caps.style.display = "inline";
      }else{
        caps.style.display = "none";
      }
    });

    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      setMsg("");

      const email = emailEl.value.trim();
      const password = passEl.value;

      btnLogin.disabled = true;
      btnLogin.textContent = "Connexion…";

      try{
        await signInWithEmailAndPassword(auth, email, password);
        setMsg("Connecté ✅", "ok");
        location.href="./me.html";
      }catch(err){
        setMsg("Erreur: " + (err?.code ?? "") + " " + (err?.message ?? err), "bad");
      }finally{
        btnLogin.disabled = false;
        btnLogin.textContent = "Se connecter";
      }
    });
  </script>
</body>
</html>
