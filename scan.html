<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Scan — CTeen</title>
  <style>
    :root{
      --bg:#0b1220; --card:#0f1b33; --line:rgba(255,255,255,.10);
      --text:#eaf0ff; --muted:rgba(234,240,255,.72);
      --blue:#2f6bff; --orange:#ff8a1f;
      --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b;
      --shadow: 0 16px 50px rgba(0,0,0,.35); --r:18px;
      --tap:48px;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(900px 520px at 15% 0%, rgba(47,107,255,.22), transparent 60%),
        radial-gradient(900px 520px at 90% 20%, rgba(255,138,31,.18), transparent 60%),
        var(--bg);
    }
    .wrap{
      max-width:900px;margin:0 auto;
      padding:
        calc(18px + env(safe-area-inset-top))
        calc(16px + env(safe-area-inset-right))
        calc(24px + env(safe-area-inset-bottom))
        calc(16px + env(safe-area-inset-left));
    }
    .top{
      display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center;
      padding:14px 14px; border:1px solid var(--line);
      background: rgba(15,27,51,.78); border-radius:var(--r);
      box-shadow:var(--shadow); backdrop-filter: blur(10px);
    }
    .badge{
      display:inline-flex; align-items:center; gap:10px;
      padding:10px 12px; border-radius:999px;
      border:1px solid var(--line); background: rgba(0,0,0,.18);
      font-weight:900;
    }
    .dot{width:10px;height:10px;border-radius:999px;background:linear-gradient(135deg,var(--blue),var(--orange))}
    .btn{
      appearance:none; border:1px solid var(--line);
      padding:0 12px; height:var(--tap); border-radius:14px;
      background: rgba(47,107,255,.22);
      color:var(--text); font-weight:900;
      cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      text-decoration:none;
      user-select:none;
    }
    .btn.orange{background: rgba(255,138,31,.20)}
    .btn.ghost{background: rgba(0,0,0,.12)}
    .btn:active{transform:translateY(1px)}
    .btn:disabled{opacity:.6; cursor:not-allowed}

    .grid{display:grid; grid-template-columns: 1.1fr .9fr; gap:12px; margin-top:12px}
    @media(max-width:900px){ .grid{grid-template-columns:1fr} }

    .card{
      border:1px solid var(--line); background: rgba(15,27,51,.78);
      border-radius:var(--r); box-shadow:var(--shadow);
      padding:14px; backdrop-filter: blur(10px);
    }
    h1{margin:0 0 6px;font-size:18px}
    p{margin:0;color:var(--muted);line-height:1.35}
    #reader{width:100%;}
    .status{
      margin-top:10px; border:1px solid var(--line); background: rgba(11,18,32,.35);
      border-radius:16px; padding:12px; font-size:14px;
    }
    .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
    .field{
      flex:1; min-width:180px;
      border:1px solid var(--line); background: rgba(11,18,32,.35);
      padding:0 12px; height:var(--tap); border-radius:14px;
      color:var(--text); outline:none;
    }
    .field::placeholder{color:rgba(234,240,255,.55)}
    .field:focus{
      border-color: rgba(47,107,255,.45);
      box-shadow: 0 0 0 3px rgba(47,107,255,.20);
    }
    code{color:#b9ccff}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="badge"><span class="dot"></span> CTeen — Scan Admin</div>
        <h1>Scanner un QR étudiant</h1>
        <p>Admin connecté requis. 1 validation max par étudiant et par jour.</p>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <a class="btn ghost" href="./admin.html">⬅ Dashboard</a>
        <button class="btn orange" id="btnStart">📷 Démarrer</button>
        <button class="btn" id="btnStop" disabled>⏹ Stop</button>
        <button class="btn ghost" id="btnTorch" style="display:none;">🔦 Flash</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div id="reader"></div>
        <div class="status" id="msg">Statut : prêt.</div>
      </div>

      <div class="card">
        <h1>Mode manuel</h1>
        <p>Si la caméra bug, colle l’ID (ou <code>SID:xxxx</code>) ici.</p>
        <div class="row">
          <input class="field" id="manual" placeholder="SID:xxxx ou studentId" inputmode="text" enterkeyhint="go" />
          <button class="btn orange" id="btnManual">Valider</button>
        </div>
        <div class="status" id="last">Dernière validation : —</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, increment, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAbnHtXih9wlT361KeoSTRccC0vWd_9fs4",
      authDomain: "maison-des-jeunes-cteen-yerres.firebaseapp.com",
      projectId: "maison-des-jeunes-cteen-yerres",
      storageBucket: "maison-des-jeunes-cteen-yerres.firebasestorage.app",
      messagingSenderId: "473890667192",
      appId: "1:473890667192:web:973af383f7319d2cdc124d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const msg = document.getElementById("msg");
    const last = document.getElementById("last");
    const btnStart = document.getElementById("btnStart");
    const btnStop = document.getElementById("btnStop");
    const btnTorch = document.getElementById("btnTorch");
    const btnManual = document.getElementById("btnManual");
    const manual = document.getElementById("manual");

    let currentUser = null;
    let scanner = null;
    let locked = false;

    // Anti re-scan instantané du même QR
    let lastSid = null;
    let lastSidAt = 0;

    // Torch/flash
    let torchOn = false;

    function setStatus(text, cls=""){
      msg.className = "status " + cls;
      msg.textContent = text;
      if(cls === "ok" && "vibrate" in navigator) navigator.vibrate(60);
    }

    function todayISO(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const dd = String(d.getDate()).padStart(2,'0');
      return `${yyyy}-${mm}-${dd}`;
    }

    async function isAdmin(uid){
      const snap = await getDoc(doc(db,"admins",uid));
      return snap.exists();
    }

    function parseSid(text){
      const t = (text ?? "").trim();
      if(!t) return null;

      // 1) format SID:xxxxx
      if(t.toUpperCase().startsWith("SID:")) return t.slice(4).trim();

      // 2) si c’est une URL, cherche sid=
      try{
        const u = new URL(t);
        const sid = new URLSearchParams(u.search).get("sid");
        if(sid) return sid;
      }catch{}

      // 3) sinon on prend brut
      return t;
    }

    async function publishStudentMessage(studentId){
      // nécessite rules publicStatus (read public, write admin)
      await setDoc(doc(db, "publicStatus", studentId), {
        lastScanAt: serverTimestamp(),
        text: "QR scanné ✅ Hazak à toi, bon cours !"
      }, { merge: true });
    }

    async function checkin(studentId){
      if(locked) return;
      locked = true;

      try{
        // anti boucle même QR (2.5s)
        const now = Date.now();
        if(studentId && studentId === lastSid && (now - lastSidAt) < 2500){
          locked = false;
          return;
        }
        lastSid = studentId;
        lastSidAt = now;

        if(!currentUser) throw new Error("Non connecté.");
        if(!(await isAdmin(currentUser.uid))) throw new Error("Non autorisé (pas admin).");
        if(!studentId) throw new Error("ID étudiant manquant.");

        const ref = doc(db,"students",studentId);
        const snap = await getDoc(ref);
        if(!snap.exists()) throw new Error("Étudiant introuvable.");

        const data = snap.data();
        const today = todayISO();

        if(data.lastCheckinDate === today){
          setStatus("Déjà validé aujourd’hui pour cet étudiant.", "warn");
          last.textContent = "Dernière validation : refusée (déjà validé aujourd’hui)";
          return;
        }

        await updateDoc(ref,{
          totalCheckins: increment(1),
          lastCheckinDate: today
        });

        // message sur la page étudiant
        try{
          await publishStudentMessage(studentId);
        }catch{
          // si rules pas mises ou hors ligne, on ignore
        }

        const newTotal = (data.totalCheckins || 0) + 1;
        const rewards = Math.floor(newTotal / 20);

        if(newTotal % 20 === 0){
          setStatus(`Validé ✅ Total: ${newTotal}. 🎁 Récompense débloquée !`, "ok");
        }else{
          setStatus(`Validé ✅ Total: ${newTotal}. Récompenses: x${rewards}`, "ok");
        }
        last.textContent = `Dernière validation : ${studentId} (total=${newTotal})`;

      }catch(e){
        setStatus("Erreur: " + (e?.message ?? e), "bad");
        last.textContent = "Dernière validation : erreur";
      }finally{
        setTimeout(()=>{ locked=false; }, 900);
      }
    }

    onAuthStateChanged(auth, async (user)=>{
      currentUser = user;
      if(!user){
        setStatus("Non connecté. Connecte-toi via admin.html.", "bad");
        return;
      }
      const ok = await isAdmin(user.uid);
      if(!ok){
        setStatus("Connecté mais non autorisé (UID absent de /admins).", "bad");
        return;
      }
      setStatus("Admin connecté ✅ Appuie sur Démarrer et scanne un QR étudiant.", "");
    });

    btnManual.onclick = async ()=>{
      const sid = parseSid(manual.value);
      await checkin(sid);
      manual.value = "";
      manual.blur();
    };

    btnStart.onclick = async ()=>{
      if(!window.Html5Qrcode){
        setStatus("Scanner non chargé (CDN).", "bad");
        return;
      }
      btnStart.disabled = true;
      btnStop.disabled = false;

      scanner = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: 260 };

      await scanner.start(
        { facingMode: "environment" },
        config,
        async (decodedText) => {
          const sid = parseSid(decodedText);
          await checkin(sid);
        },
        () => {}
      );

      // Torch si supporté
      try{
        const caps = await scanner.getRunningTrackCapabilities();
        if(caps && ("torch" in caps)){
          btnTorch.style.display = "inline-flex";
        }else{
          btnTorch.style.display = "none";
        }
      }catch{
        btnTorch.style.display = "none";
      }
    };

    btnTorch.onclick = async ()=>{
      if(!scanner) return;
      try{
        torchOn = !torchOn;
        await scanner.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
        btnTorch.textContent = torchOn ? "🔦 Flash ON" : "🔦 Flash";
      }catch{
        setStatus("Flash non supporté sur cet appareil.", "warn");
        btnTorch.style.display = "none";
        torchOn = false;
      }
    };

    btnStop.onclick = async ()=>{
      btnStop.disabled = true;
      btnStart.disabled = false;

      try{
        if(scanner){
          await scanner.stop();
          scanner.clear();
        }
      }catch{}

      torchOn = false;
      btnTorch.textContent = "🔦 Flash";
      btnTorch.style.display = "none";

      setStatus("Scanner stoppé.", "");
    };
  </script>
</body>
</html>
