<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CTeen — Inscription</title>

  <!-- CSS centralisé -->
  <link rel="stylesheet" href="./css/style.css">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0b1220">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>
  <div class="center">
    <div class="card card-md">
      <div class="brandRow">
        <div class="badge"><span class="brandDot"></span> CTeen</div>
        <div class="muted tiny strong">Inscription</div>
      </div>

      <h1 class="h1">Créer ton compte étudiant</h1>
      <p class="muted">Tu obtiens ton QR + ton suivi de présences.</p>

      <form id="form">
        <div class="grid2">
          <input id="firstName" class="field" placeholder="Prénom"
                 autocomplete="given-name" enterkeyhint="next" required>

          <input id="lastName" class="field" placeholder="Nom"
                 autocomplete="family-name" enterkeyhint="next" required>
        </div>

        <input id="email" class="field" type="email" placeholder="Email"
               autocomplete="email" inputmode="email" enterkeyhint="next" required>

        <input id="password" class="field" type="password" placeholder="Mot de passe (6+)"
               autocomplete="new-password" enterkeyhint="next" required>

        <input id="password2" class="field" type="password" placeholder="Confirmer le mot de passe"
               autocomplete="new-password" enterkeyhint="go" required>

        <div class="rowBetween">
          <label class="toggle">
            <input id="showPass" type="checkbox">
            Afficher les mots de passe
          </label>
          <span class="muted tiny" id="caps" style="display:none;">⚠️ Majuscule activée</span>
        </div>

        <div class="helper" id="pwdHint">
          Conseil : utilise au moins 6 caractères. Mélanger lettres et chiffres est mieux.
        </div>

        <button id="btnSignup" class="btn orange w100" type="submit">Créer mon compte</button>
        <p class="msg" id="msg"></p>
      </form>

      <div class="divider"></div>

      <div class="links">
        <span class="muted tiny">Déjà inscrit ? <a href="./login.html">Se connecter</a></span>
        <a class="muted tiny" href="./admin.html" style="opacity:.85;">Espace admin</a>
      </div>
    </div>
  </div>

  <!-- Service worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAbnHtXih9wlT361KeoSTRccC0vWd_9fs4",
      authDomain: "maison-des-jeunes-cteen-yerres.firebaseapp.com",
      projectId: "maison-des-jeunes-cteen-yerres",
      storageBucket: "maison-des-jeunes-cteen-yerres.firebasestorage.app",
      messagingSenderId: "473890667192",
      appId: "1:473890667192:web:973af383f7319d2cdc124d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("form");
    const firstNameEl = document.getElementById("firstName");
    const lastNameEl = document.getElementById("lastName");
    const emailEl = document.getElementById("email");
    const passEl = document.getElementById("password");
    const pass2El = document.getElementById("password2");
    const showPass = document.getElementById("showPass");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btnSignup");
    const caps = document.getElementById("caps");
    const pwdHint = document.getElementById("pwdHint");

    function setMsg(text, kind=""){
      msg.className = "msg " + kind;
      msg.textContent = text;
    }

    firstNameEl.focus();

    showPass.addEventListener("change", (e)=>{
      const t = e.target.checked ? "text" : "password";
      passEl.type = t;
      pass2El.type = t;
    });

    function capsCheck(e){
      if(e.getModifierState && e.getModifierState("CapsLock")){
        caps.style.display = "inline";
      }else{
        caps.style.display = "none";
      }
    }
    passEl.addEventListener("keyup", capsCheck);
    pass2El.addEventListener("keyup", capsCheck);

    passEl.addEventListener("input", ()=>{
      const v = passEl.value || "";
      const okLen = v.length >= 6;
      const hasNum = /\d/.test(v);
      const hasLetter = /[A-Za-z]/.test(v);

      if(!v){
        pwdHint.textContent = "Conseil : utilise au moins 6 caractères. Mélanger lettres et chiffres est mieux.";
        pwdHint.dataset.state = "";
        return;
      }

      if(okLen && hasNum && hasLetter){
        pwdHint.textContent = "Mot de passe OK ✅";
        pwdHint.dataset.state = "ok";
      }else{
        pwdHint.textContent = "Mot de passe un peu faible : vise 6+ caractères + lettres et chiffres.";
        pwdHint.dataset.state = "warn";
      }
    });

    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      setMsg("");

      const firstName = firstNameEl.value.trim();
      const lastName = lastNameEl.value.trim();
      const email = emailEl.value.trim();
      const password = passEl.value;
      const password2 = pass2El.value;

      if(!firstName || !lastName) return setMsg("Nom + prénom obligatoires.", "bad");
      if(password.length < 6) return setMsg("Mot de passe trop court (6 caractères minimum).", "bad");
      if(password !== password2) return setMsg("Les mots de passe ne correspondent pas.", "bad");

      btn.disabled = true;
      btn.textContent = "Création…";

      try{
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        const uid = cred.user.uid;

        await setDoc(doc(db, "students", uid), {
          firstName, lastName,
          email,
          totalCheckins: 0,
          lastCheckinDate: null,
          createdAt: serverTimestamp()
        });

        setMsg("Compte créé ✅ Redirection…", "ok");
        setTimeout(()=> location.href = "./me.html", 700);
      }catch(err){
        setMsg("Erreur: " + (err?.code ?? "") + " " + (err?.message ?? err), "bad");
      }finally{
        btn.disabled = false;
        btn.textContent = "Créer mon compte";
      }
    });
  </script>
</body>
</html>
