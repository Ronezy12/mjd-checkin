<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carte étudiant — CTeen</title>

  <!-- CSS centralisé -->
  <link rel="stylesheet" href="./css/style.css">

  <!-- PWA (optionnel mais cohérent) -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0b1220">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>
  <div class="wrap wrap-student">
    <div class="card">
      <div class="topStudent">
        <div class="brandStudent">
          <div class="badge"><span class="brandDot"></span> CTeen — Carte étudiant</div>
          <h1 class="h1">Présente ce QR à l’admin</h1>
          <p class="muted">Le QR contient ton identifiant et sert à valider ta présence.</p>
        </div>
      </div>

      <div class="studentGrid">
        <div class="pane">
          <div class="nameBig" id="fullName">Chargement…</div>
          <div class="subLine">ID: <code id="sid">—</code></div>

          <div class="muted mt10">
            Astuce : garde cette page en favori sur ton téléphone.
          </div>

          <div class="btnRow">
            <button class="btn ghost" id="btnPrint" type="button">🖨️ Imprimer</button>
            <a class="btn orange" href="./scan.html" style="text-decoration:none;display:inline-flex;align-items:center;">
              Admin scan
            </a>
          </div>
        </div>

        <div class="pane">
          <div class="qrWrap">
            <div class="qrFrame">
              <img id="qrImg" class="qr" alt="QR étudiant" />
            </div>
          </div>
          <div class="muted mt10">
            Si l’admin scanne, ta présence est validée (max 1 fois par jour).
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Service worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAbnHtXih9wlT361KeoSTRccC0vWd_9fs4",
      authDomain: "maison-des-jeunes-cteen-yerres.firebaseapp.com",
      projectId: "maison-des-jeunes-cteen-yerres",
      storageBucket: "maison-des-jeunes-cteen-yerres.firebasestorage.app",
      messagingSenderId: "473890667192",
      appId: "1:473890667192:web:973af383f7319d2cdc124d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(location.search);
    const sid = params.get("sid");

    const sidEl = document.getElementById("sid");
    const nameEl = document.getElementById("fullName");
    const qrImg = document.getElementById("qrImg");

    document.getElementById("btnPrint").onclick = ()=> window.print();

    function setQrAlways(id){
      const payload = `SID:${id}`;
      const url1 = `https://api.qrserver.com/v1/create-qr-code/?size=700x700&data=${encodeURIComponent(payload)}`;
      const url2 = `https://quickchart.io/qr?size=700&text=${encodeURIComponent(payload)}`;
      qrImg.src = url1;
      qrImg.onerror = ()=> { qrImg.src = url2; };
    }

    async function main(){
      if(!sid){
        nameEl.textContent = "ID manquant";
        sidEl.textContent = "—";
        return;
      }

      sidEl.textContent = sid;
      setQrAlways(sid);

      // Tentative d’afficher le nom (peut échouer si rules bloquent)
      try{
        const snap = await getDoc(doc(db,"students",sid));
        if(!snap.exists()){
          nameEl.textContent = "Étudiant introuvable";
          return;
        }
        const d = snap.data();
        nameEl.textContent = `${d.lastName ?? ""} ${d.firstName ?? ""}`.trim() || "Étudiant";
      }catch{
        nameEl.textContent = "Carte étudiant";
      }
    }

    main();
  </script>
</body>
</html>
