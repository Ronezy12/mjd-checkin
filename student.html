<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carte étudiant — CTeen</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#0f1b33;
      --line:rgba(255,255,255,.10);
      --text:#eaf0ff;
      --muted:rgba(234,240,255,.72);
      --blue:#2f6bff;
      --orange:#ff8a1f;
      --shadow: 0 16px 50px rgba(0,0,0,.35);
      --r:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(900px 520px at 15% 0%, rgba(47,107,255,.22), transparent 60%),
        radial-gradient(900px 520px at 90% 20%, rgba(255,138,31,.18), transparent 60%),
        var(--bg);
    }
    .wrap{max-width:820px;margin:0 auto;padding:22px 16px 40px}
    .card{
      border:1px solid var(--line);
      background: rgba(15,27,51,.78);
      border-radius:var(--r);
      box-shadow:var(--shadow);
      padding:18px;
      backdrop-filter: blur(10px);
    }
    .top{
      display:flex; gap:12px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap;
      margin-bottom:10px;
    }
    .brand{
      display:flex; flex-direction:column; gap:6px;
    }
    .badge{
      display:inline-flex; align-items:center; gap:10px;
      padding:10px 12px; border-radius:999px;
      border:1px solid var(--line); background: rgba(0,0,0,.18);
      font-weight:800; letter-spacing:.3px;
    }
    .dot{width:10px;height:10px;border-radius:999px;background:linear-gradient(135deg,var(--blue),var(--orange))}
    h1{margin:0;font-size:18px}
    p{margin:0;color:var(--muted);line-height:1.35}
    .grid{
      margin-top:14px;
      display:grid; grid-template-columns: 1fr 1fr; gap:12px;
    }
    @media(max-width:720px){ .grid{grid-template-columns:1fr} }
    .pane{
      border:1px solid var(--line);
      background: rgba(11,18,32,.35);
      border-radius:16px;
      padding:14px;
    }
    .name{
      font-size:22px; font-weight:900; letter-spacing:.2px;
    }
    .sub{margin-top:6px;font-size:13px;color:var(--muted)}
    .qrWrap{
      display:flex; justify-content:center; align-items:center;
      padding:14px;
    }
    .qr{
      width: min(320px, 80vw);
      aspect-ratio:1/1;
      border-radius:20px;
      border:1px solid var(--line);
      background:white;
      display:block;
    }
    .hint{
      margin-top:10px;
      font-size:13px;
      color:var(--muted);
    }
    .btnRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .btn{
      appearance:none; border:1px solid var(--line);
      padding:10px 12px; border-radius:14px;
      background: rgba(47,107,255,.22);
      color:var(--text); font-weight:800;
      cursor:pointer;
    }
    .btn.orange{background: rgba(255,138,31,.20)}
    .btn:active{transform:translateY(1px)}
    code{color:#b9ccff}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div class="brand">
          <div class="badge"><span class="dot"></span> CTeen — Carte étudiant</div>
          <h1>Présente ce QR à l’admin</h1>
          <p>Le QR contient ton identifiant et sert à valider ta présence.</p>
        </div>
      </div>

      <div class="grid">
        <div class="pane">
          <div class="name" id="fullName">Chargement…</div>
          <div class="sub">ID: <code id="sid">—</code></div>
          <div class="hint">
            Astuce : garde cette page en favori sur ton téléphone.
          </div>
          <div class="btnRow">
            <button class="btn" onclick="window.print()">🖨️ Imprimer</button>
            <a class="btn orange" href="./scan.html" style="text-decoration:none;display:inline-flex;align-items:center;">Admin scan</a>
          </div>
        </div>

        <div class="pane">
          <div class="qrWrap">
            <img id="qrImg" class="qr" alt="QR étudiant" />
          </div>
          <div class="hint">
            Si l’admin scanne, ta présence est validée (max 1 fois par jour).
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAbnHtXih9wlT361KeoSTRccC0vWd_9fs4",
      authDomain: "maison-des-jeunes-cteen-yerres.firebaseapp.com",
      projectId: "maison-des-jeunes-cteen-yerres",
      storageBucket: "maison-des-jeunes-cteen-yerres.firebasestorage.app",
      messagingSenderId: "473890667192",
      appId: "1:473890667192:web:973af383f7319d2cdc124d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(location.search);
    const sid = params.get("sid");

    const sidEl = document.getElementById("sid");
    const nameEl = document.getElementById("fullName");
    const qrImg = document.getElementById("qrImg");

    function basePath(){
      return location.origin + location.pathname.replace(/\/[^\/]*$/, "/");
    }

    async function main(){
      if(!sid){
        nameEl.textContent = "ID manquant";
        sidEl.textContent = "—";
        return;
      }
      sidEl.textContent = sid;

      const snap = await getDoc(doc(db,"students",sid));
      if(!snap.exists()){
        nameEl.textContent = "Étudiant introuvable";
        return;
      }
      const d = snap.data();
      nameEl.textContent = `${d.lastName ?? ""} ${d.firstName ?? ""}`.trim();

      // QR encode juste un texte "SID:<id>" (simple, rapide à décoder côté admin)
      const payload = `SID:${sid}`;
      const qr = `https://api.qrserver.com/v1/create-qr-code/?size=520x520&data=${encodeURIComponent(payload)}`;
      qrImg.src = qr;
    }

    main();
  </script>
</body>
</html>
